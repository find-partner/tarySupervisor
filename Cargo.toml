[workspace]
resolver = "2"
members = ["crates/core", "src-tauri"]

# 根包 = Leptos 前端（Trunk 以 wasm32 目标构建本包，全程无 Node.js）
[package]
name = "traysupervisor-ui"
version = "0.1.0"
edition = "2021"
description = "TraySupervisor 前端（Leptos CSR / WASM）"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
log = "0.4"

[dependencies]
leptos = { version = "0.6", features = ["csr"] }
serde_json = "1" 
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { workspace = true }
serde-wasm-bindgen = "0.6"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlInputElement",
    "Location",
    "Navigator",
    "ClipboardEvent",
    "DataTransfer",
] }
