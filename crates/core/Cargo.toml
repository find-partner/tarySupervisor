[package]
name = "traysupervisor-core"
version = "0.5.0"
edition = "2021"
description = "TraySupervisor 纯 Rust 核心：配置/进程管理/日志/终端仿真（无 tauri 依赖，NFR-8）"

[dependencies]
serde = { workspace = true }
serde_json = "1"
tokio = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
regex = "1"
notify = "8"
file-rotate = "0.8"
portable-pty = "0.8"
vte = "0.13"
chrono = "0.4"
dirs = "6"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
