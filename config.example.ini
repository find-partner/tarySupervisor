# TraySupervisor 配置文件示例
# 路径：~/.traysupervisor/config.ini（Windows：%USERPROFILE%\.traysupervisor\config.ini）
# 完整规范见 docs/CONFIG-SPEC.md；未知键视为校验错误，保存时逐项报告

[traysupervisor]
log_lines=2000
notify_on_failure=true
# ---------------------------------------------------------------------------
# 平台体系（FR-2.13）：内置 windows / macos / linux（运行时自动检测）；
# 可声明自定义平台（名字[:OS 家族]，家族用于未命中变体时回退），例如：
# platforms=home-mac:macos, office-win:windows
# 当前所在平台：自定义平台无法自动检测，必须在此声明"这台机器是谁"；
# 仅用内置平台时留空即可。注意：此键随配置文件同步，换机后需改一次。
# current_platform=home-mac

# ---------------------------------------------------------------------------
# 示例 1：本地静态文档站（Windows 路径写法，反斜杠无需转义）
# ---------------------------------------------------------------------------
[program:dev-docs]
name=文档站
command=python -m http.server 8000 --directory "C:\work\docs"
directory=C:\work\docs
autostart=true
autorestart=on-failure
startsecs=3
stopwaitsecs=10
stdout_logfile=~/.traysupervisor/logs/dev-docs.log
# 单文件上限：支持 KB/MB/GB 单位（大小写不敏感），兼容纯字节数；0 = 不轮转
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
logfile_compress=true
# Matcher：日志正则 → 托盘快捷项（template 的 {0} {1} 引用捕获组）
matcher.1.pattern=https?://\S+
matcher.1.template=🌐 打开 {0}
matcher.1.max_items=5

# ---------------------------------------------------------------------------
# 示例 2：Node 服务（Unix 路径写法；environment 演示变量替换）
# ---------------------------------------------------------------------------
[program:api-server]
name=API 服务
command=node --max-old-space-size=512 main.js
directory=~/work/api
spawn_mode=pipe
autostart=false
autorestart=always
startretries=5
# environment：KEY="value" 逗号分隔；值默认字面量直传；
# 前缀 ! 开启 ${VAR} 替换（先查本表前面条目，再查系统环境；未定义 = 校验错误）；
# 行级平台标签 @平台（或 @all）：该行仅在该平台生效，无标签 = 全部平台；
# 同名键平台条目就地覆盖全部平台条目
environment=NODE_ENV="development", LOG_DIR="!${HOME}/logs/api", PORT="3000", LOG_DIR="!${LOCALAPPDATA}\logs"@windows
redirect_stderr=false

# ---------------------------------------------------------------------------
# 示例 2b：平台变体（FR-2.13）——同一服务在不同平台用不同命令/目录/捕获方式。
# 变体键 = 基础键.<平台>；未命中变体的平台用基础键默认值；
# 组合校验按平台展开（如 term_interactive=true 需与 spawn_mode=pty 成对覆盖）
# ---------------------------------------------------------------------------
[program:api-server-win]
name=API 服务（多平台示例）
command=npx -y api-server@latest --port=3000
command.macos=/opt/homebrew/bin/node --max-old-space-size=512 main.js
command.windows=C:\tools\api-server.exe --port 3000
directory.windows=C:\work\api
spawn_mode.windows=pipe
term_interactive.windows=false

# ---------------------------------------------------------------------------
# 示例 3：PTY 模式（彩色/进度条输出经 vte 渲染到只读终端视图）
# ---------------------------------------------------------------------------
[program:build-task]
name=构建任务
command=/opt/ci/run-build.sh --verbose
spawn_mode=pty
autorestart=no
stopwaitsecs=15

# ---------------------------------------------------------------------------
# 示例 4：经 shell 启动（继承 .zshrc/.bashrc 环境，如 nvm 管理的 node）
# shell=true：命令经 $SHELL -ilc 启动；argv 按原样重组，不支持管道/&& 等 shell 语法。
# 不开 shell 也可运行：运行时会自动注入登录 shell 的 PATH 兜底（环境无 PATH 配置时）
# ---------------------------------------------------------------------------
[program:mcp-gateway]
name=MCP 网关
command=mcp-gateway --port 8080
shell=true
autostart=false
autorestart=on-failure
startretries=3
