[Launch]
; The actual binary, relative to App\ (PA.c spec). Same exe for 64-bit.
ProgramExecutable=TraySupervisor\TraySupervisor.exe
ProgramExecutable64=TraySupervisor\TraySupervisor.exe
; All paths are computed at runtime (drive-letter safe); single-instance is
; handled in-app via tauri-plugin-single-instance.
DirectoryMoveOK=yes
SupportsUNC=yes

[Environment]
; App-side data root (replaces ~/.traysupervisor): config.ini and logs\ live in Data\
TRAYSUPERVISOR_DATA_DIR=%PAL:DataDir%
; Keep the WebView2 user-data folder inside Data\ (MS docs: this env var overrides the API parameter)
WEBVIEW2_USER_DATA_FOLDER=%PAL:DataDir%\EBWebView
