[Launch]
; 真身相对 App\ 目录（PAL 规范）；64 位系统用同名 exe，无需单独 64 位键
ProgramExecutable=TraySupervisor\TraySupervisor.exe
ProgramExecutable64=TraySupervisor\TraySupervisor.exe
; 全部路径运行时计算，换盘符安全；单实例由应用内 tauri-plugin-single-instance 负责
DirectoryMoveOK=yes
SupportsUNC=yes

[Environment]
; 应用侧数据根目录（替代 ~/.traysupervisor），config.ini 与 logs/ 均落在 Data\ 内
TRAYSUPERVISOR_DATA_DIR=%PAL:DataDir%
; WebView2 用户数据目录收进 Data\，避免写宿主 LOCALAPPDATA（MS 文档：该环境变量覆盖 API 参数）
WEBVIEW2_USER_DATA_FOLDER=%PAL:DataDir%\EBWebView
