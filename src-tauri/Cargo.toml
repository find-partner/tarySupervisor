[package]
name = "traysupervisor"
version = "0.1.0"
edition = "2021"
description = "TraySupervisor：系统托盘后台服务管理工具（Tauri v2 壳）"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
traysupervisor-core = { path = "../crates/core" }
serde = { workspace = true }
serde_json = "1"
tokio = { workspace = true }
log = { workspace = true }
env_logger = "0.11"
signal-hook = "0.3"
