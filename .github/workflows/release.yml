# 发布工作流：tag 触发，三平台构建安装包并上传 GitHub Release
#
# 触发：推送 v* 标签（git tag v0.5.0 && git push origin v0.5.0）
# 产物：
#   - macOS：universal（Intel + Apple Silicon）dmg——MACOSX_DEPLOYMENT_TARGET=10.13
#     （Tauri v2 最低要求；macOS 12 在两个架构的支持范围内）
#   - Windows：msi + nsis 安装器（x64，要求 Windows 10+，Win7 不支持——见 SYSTEM-TEST §3）
#   - Linux：deb + AppImage（x64）
#
# 说明：tauri build 自动执行 beforeBuildCommand（trunk build）；应用未签名，
# macOS 首次打开需右键→打开绕过 Gatekeeper，Windows SmartScreen 可能拦截。
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            targets: aarch64-apple-darwin,x86_64-apple-darwin,wasm32-unknown-unknown
            tauri_args: --target universal-apple-darwin
            bundles: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - os: windows-2022
            targets: wasm32-unknown-unknown
            tauri_args: ""
            bundles: |
              target/release/bundle/msi/*.msi
              target/release/bundle/nsis/*.exe
          - os: ubuntu-24.04
            targets: wasm32-unknown-unknown
            tauri_args: ""
            bundles: |
              target/release/bundle/deb/*.deb
              target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: |
            ~/.cargo/bin

      - name: 安装 Linux 系统依赖（Tauri / WebKitGTK 4.1）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: 安装 trunk（beforeBuildCommand 需要；三平台与 ci.yml 同一方式）
        uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: 安装 tauri-cli（源码编译；二进制经 rust-cache 缓存，二次起秒装）
        run: cargo install tauri-cli --version "^2" --locked

      - name: 构建安装包（macOS 部署目标 10.13 → 兼容 macOS 12）
        if: runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: "10.13"
        run: cargo tauri build ${{ matrix.tauri_args }}

      - name: 构建安装包
        if: runner.os != 'macOS'
        run: cargo tauri build ${{ matrix.tauri_args }}

      - name: 上传到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.bundles }}
          generate_release_notes: true
