# TraySupervisor CI（HLD §7：三平台矩阵）
#
# 职责：
#   1. core 测试回归（Linux/macOS 跑全部单元+集成；Windows 跑单元——集成用例使用 Unix 进程路径，
#      Windows 的进程托管语义由 scripts/smoke-windows.ps1 与 spikes/windows 在真机覆盖）
#   2. 全量编译检查（Windows runner 会真实编译 Job Object / windows-sys 平台分支）
#   3. 前端 WASM 构建（trunk build，无 Node.js）
#
# 说明：冒烟脚本需 GUI 会话（托盘），不在 CI 中运行；见 docs/SYSTEM-TEST.md §4。
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: 安装 Linux 系统依赖（Tauri / WebKitGTK 4.1）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: 安装 trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: core 测试（单元 + 集成，真实进程）
        if: runner.os != 'Windows'
        run: cargo test -p traysupervisor-core

      - name: core 单元测试（Windows：集成用例为 Unix 路径，见 SYSTEM-TEST §7）
        if: runner.os == 'Windows'
        run: cargo test -p traysupervisor-core --lib

      - name: 全量编译检查（含 src-tauri 平台分支）
        run: cargo check --workspace --all-targets

      - name: 前端构建（Leptos → WASM）
        run: trunk build

      - name: 上传前端产物
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist/
          retention-days: 7
